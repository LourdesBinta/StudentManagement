<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${student.id == null} ? 'Add Student' : 'Edit Student'">Student Form</h2>
    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>First Name</label>
            <input type="text" class="form-control" th:field="*{firstName}"/>
        </div>
        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" class="form-control" th:field="*{lastName}"/>
        </div>
        <div class="mb-3">
            <label>Grade</label>
            <input type="text" class="form-control" th:field="*{grade}"/>
        </div>
        <div class="mb-3">
            <label>Section</label>
            <input type="text" class="form-control" th:field="*{section}"/>
        </div>
        <div class="mb-3">
            <label>Contact Number</label>
            <input type="text" class="form-control" th:field="*{contactNumber}"/>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="text" class="form-control" th:field="*{email}"/>
        </div>
        <div class="mb-3">
            <label>Student Status</label>
            <input type="text" class="form-control" th:field="*{studentStatus}"/>
        </div>
        <div class="mb-3">
            <label>Enrolment Year</label>
            <input type="text" class="form-control" th:field="*{enrolmentYear}"/>
        </div>
        <div class="mb-3">
            <label>Graduation Year</label>
            <input type="text" class="form-control" th:field="*{graduationYear}"/>
        </div>
        <div class="mb-3">
            <label>Date Left</label>
            <input type="text" class="form-control" th:field="*{dateLeft}"/>
        </div>
        <div class="mb-3">
            <label>Reason Left</label>
            <input type="text" class="form-control" th:field="*{reasonLeft}"/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/students" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
