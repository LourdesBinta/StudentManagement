<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Membership Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${membership.id == null} ? 'Add Membership' : 'Edit Membership'">Membership Form</h2>
    <form th:action="@{/memberships/save}" th:object="${membership}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Student ID</label>
            <input type="number" class="form-control" th:field="*{studentId}"/>
        </div>
        <div class="mb-3">
            <label>Club ID</label>
            <input type="number" class="form-control" th:field="*{clubId}"/>
        </div>
        <div class="mb-3">
            <label>Date Joined</label>
            <input type="date" class="form-control" th:field="*{dateJoined}"/>
        </div>
        <div class="mb-3">
            <label>Date Left</label>
            <input type="date" class="form-control" th:field="*{dateLeft}"/>
        </div>
        <div class="mb-3">
            <label>Status</label>
            <input type="text" class="form-control" th:field="*{status}"/>
        </div>
        <div class="mb-3">
            <label>School Year</label>
            <input type="text" class="form-control" th:field="*{schoolYear}"/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/memberships" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
