<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Club Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${club.id == null} ? 'Add Club' : 'Edit Club'">Club Form</h2>
    <form th:action="@{/clubs/save}" th:object="${club}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Club Name</label>
            <input type="text" class="form-control" th:field="*{clubName}"/>
        </div>
        <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label>Advisor Name</label>
            <input type="text" class="form-control" th:field="*{advisorName}"/>
        </div>
        <div class="mb-3">
            <label>Meeting Day</label>
            <input type="text" class="form-control" th:field="*{meetingDay}"/>
        </div>
        <div class="mb-3">
            <label>Meeting Time</label>
            <input type="text" class="form-control" th:field="*{meetingTime}"/>
        </div>
        <div class="mb-3">
            <label>Max Members</label>
            <input type="number" class="form-control" th:field="*{maxMembers}"/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/clubs" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
