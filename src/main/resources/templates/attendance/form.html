<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${attendance.id == null} ? 'Add Attendance' : 'Edit Attendance'">Attendance Form</h2>
    <form th:action="@{/attendance/save}" th:object="${attendance}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Event ID</label>
            <input type="number" class="form-control" th:field="*{eventId}"/>
        </div>
        <div class="mb-3">
            <label>Student ID</label>
            <input type="number" class="form-control" th:field="*{studentId}"/>
        </div>
        <div class="mb-3">
            <label>Attendance Status</label>
            <select class="form-control" th:field="*{attendanceStatus}">
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/attendance" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
