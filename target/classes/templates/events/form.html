<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${event.id == null} ? 'Add Event' : 'Edit Event'">Event Form</h2>
    <form th:action="@{/events/save}" th:object="${event}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Event Name</label>
            <input type="text" class="form-control" th:field="*{eventName}"/>
        </div>
        <div class="mb-3">
            <label>Event Date</label>
            <input type="date" class="form-control" th:field="*{eventDate}"/>
        </div>
        <div class="mb-3">
            <label>Event Time</label>
            <input type="text" class="form-control" th:field="*{eventTime}"/>
        </div>
        <div class="mb-3">
            <label>Location</label>
            <input type="text" class="form-control" th:field="*{location}"/>
        </div>
        <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label>School Year</label>
            <input type="text" class="form-control" th:field="*{schoolYear}"/>
        </div>
        <div class="mb-3">
            <label>Club ID</label>
            <input type="number" class="form-control" th:field="*{clubId}"/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/events" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
