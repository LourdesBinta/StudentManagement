<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; padding-top: 20px; }
        .sidebar .nav-link { color: #adb5bd; padding: 10px 20px; border-radius: 5px; margin: 3px 10px; }
        .sidebar .nav-link:hover { background-color: #343a40; color: white; }
        .sidebar .nav-link.active { background-color: #0d6efd; color: white; }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { padding: 30px; }
        .sidebar-header { color: #6c757d; font-size: 0.75rem; text-transform: uppercase; padding: 10px 20px; letter-spacing: 1px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>School Club Management System</span>
    <div class="d-flex align-items-center text-white">
        <span class="badge bg-danger me-2">ADMIN</span>
        <i class="bi bi-person-circle me-2"></i>
        <span th:text="${session.username}" class="me-3">Admin</span>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="sidebar-header mt-3">Admin Panel</div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/users"><i class="bi bi-people-fill"></i>Manage Users</a></li>
                <div class="sidebar-header mt-3">Management</div>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-people-fill"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/clubs"><i class="bi bi-star-fill"></i>Clubs</a></li>
                <li class="nav-item"><a class="nav-link" href="/events"><i class="bi bi-calendar-event-fill"></i>Events</a></li>
                <li class="nav-item"><a class="nav-link" href="/memberships"><i class="bi bi-person-badge-fill"></i>Memberships</a></li>
                <li class="nav-item"><a class="nav-link" href="/attendance"><i class="bi bi-clipboard-check-fill"></i>Attendance</a></li>
                <li class="nav-item"><a class="nav-link" href="/register"><i class="bi bi-person-plus-fill"></i>Register</a></li>
                <li class="nav-item"><a class="nav-link" href="/search"><i class="bi bi-search"></i>Search</a></li>
            </ul>
        </div>
        <div class="col-md-10 main-content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <h2 class="mb-4"><i class="bi bi-people-fill me-2"></i>Manage Users</h2>

            <!-- Add New User -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-person-plus me-2"></i>Add New User
                </div>
                <div class="card-body">
                    <form action="/admin/users/save" method="post">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Username</label>
                                <input type="text" name="username" class="form-control" required/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Password</label>
                                <input type="text" name="password" class="form-control" required/>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Role</label>
                                <select name="role" class="form-control" required>
                                    <option value="ADMIN">Admin</option>
                                    <option value="TEACHER">Teacher</option>
                                    <option value="STUDENT">Student</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Club (Teachers)</label>
                                <select name="clubId" class="form-control">
                                    <option value="">None</option>
                                    <option th:each="club : ${clubs}"
                                            th:value="${club.id}"
                                            th:text="${club.clubName}"></option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-plus-circle me-1"></i>Add User
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover table-bordered">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Club</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td>
                                <span th:text="${user.role}"
                                      th:classappend="${user.role == 'ADMIN'} ? 'badge bg-danger' : (${user.role == 'TEACHER'} ? 'badge bg-warning' : 'badge bg-success')">
                                </span>
                            </td>
                            <td>
                                <span th:each="club : ${clubs}"
                                      th:if="${club.id == user.clubId}"
                                      th:text="${club.clubName}"></span>
                                <span th:if="${user.clubId == null}" class="text-muted">None</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete this user?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
