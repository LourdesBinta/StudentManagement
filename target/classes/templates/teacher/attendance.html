<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Grade Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; padding-top: 20px; }
        .sidebar .nav-link { color: #adb5bd; padding: 10px 20px; border-radius: 5px; margin: 3px 10px; }
        .sidebar .nav-link:hover { background-color: #343a40; color: white; }
        .sidebar .nav-link.active { background-color: #0d6efd; color: white; }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { padding: 30px; }
        .sidebar-header { color: #6c757d; font-size: 0.75rem; text-transform: uppercase; padding: 10px 20px; letter-spacing: 1px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>School Club Management System</span>
    <div class="d-flex align-items-center text-white">
        <span class="badge bg-warning text-dark me-2">TEACHER</span>
        <i class="bi bi-person-circle me-2"></i>
        <span th:text="${session.username}" class="me-3"></span>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="sidebar-header mt-3">Teacher Panel</div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/teacher/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/teacher/attendance"><i class="bi bi-clipboard-check-fill"></i>Grade Attendance</a></li>
                <li class="nav-item"><a class="nav-link" href="/register"><i class="bi bi-person-plus-fill"></i>Register Student</a></li>
                <li class="nav-item"><a class="nav-link" href="/search"><i class="bi bi-search"></i>Search Student</a></li>
            </ul>
        </div>
        <div class="col-md-10 main-content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <h2 class="mb-4"><i class="bi bi-clipboard-check-fill me-2"></i>Grade Attendance</h2>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Mark Attendance for a Student
                </div>
                <div class="card-body">
                    <form action="/teacher/attendance/save" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Student</label>
                                <select name="studentId" class="form-control" required>
                                    <option value="">Select student...</option>
                                    <option th:each="m : ${memberships}"
                                            th:if="${studentMap[m.studentId] != null}"
                                            th:value="${m.studentId}"
                                            th:text="${studentMap[m.studentId].firstName + ' ' + studentMap[m.studentId].lastName}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Event</label>
                                <select name="eventId" class="form-control" required>
                                    <option value="">Select event...</option>
                                    <option th:each="event : ${events}"
                                            th:value="${event.id}"
                                            th:text="${event.eventName}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Status</label>
                                <select name="attendanceStatus" class="form-control" required>
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                    <option value="Late">Late</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-check-circle me-1"></i>Save
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
