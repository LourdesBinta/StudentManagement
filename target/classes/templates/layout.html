<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>School Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; font-size: 1.3rem; }
        .nav-link.active { background-color: #0d6efd !important; color: white !important; border-radius: 5px; }
        .sidebar { min-height: 100vh; background-color: #212529; padding-top: 20px; }
        .sidebar .nav-link { color: #adb5bd; padding: 10px 20px; border-radius: 5px; margin: 3px 10px; }
        .sidebar .nav-link:hover { background-color: #343a40; color: white; }
        .sidebar .nav-link.active { background-color: #0d6efd; color: white; }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { padding: 30px; }
        .sidebar-header { color: #6c757d; font-size: 0.75rem; text-transform: uppercase; padding: 10px 20px; letter-spacing: 1px; }
    </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">
        <i class="bi bi-mortarboard-fill me-2"></i>School Club Management System
    </span>
    <div class="d-flex align-items-center text-white">
        <i class="bi bi-person-circle me-2"></i>
        <span th:text="${session.username}" class="me-3">Admin</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="sidebar-header mt-3">Navigation</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'students'} ? 'active'" href="/students">
                        <i class="bi bi-people-fill"></i>Students
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'clubs'} ? 'active'" href="/clubs">
                        <i class="bi bi-star-fill"></i>Clubs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'events'} ? 'active'" href="/events">
                        <i class="bi bi-calendar-event-fill"></i>Events
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'memberships'} ? 'active'" href="/memberships">
                        <i class="bi bi-person-badge-fill"></i>Memberships
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'attendance'} ? 'active'" href="/attendance">
                        <i class="bi bi-clipboard-check-fill"></i>Attendance
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <!-- Each page content goes here -->
        </div>
    </div>
</div>
</body>
</html>
